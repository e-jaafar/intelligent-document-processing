x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://idp:idp@db/idp
    CELERY_BROKER_URL: redis://redis:6379/0
    OCR_LANG: ${OCR_LANG:-fra+eng}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
  volumes:
    - documents:/app/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    <<: *app
    command: celery -A app.tasks worker --loglevel=info --concurrency=1
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "idp", "-d", "idp"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  documents:
  postgres:
  redis:
